name: Build and publish releases

'on':
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Rust CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versión que se publicará (por ejemplo, v0.1.1)"
        required: true
        type: string
        default: "v0.1.1"

permissions:
  contents: write

jobs:
  build:
    if: >-
      ${{ (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
          && (github.event_name != 'push' || !contains(github.ref_name, '-auto.')) }}
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: nelroot
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: nelroot
          - name: android-aarch64
            os: ubuntu-latest
            target: aarch64-linux-android
            archive: tar.gz
            binary: nelroot
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: nelroot.exe
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: nelroot
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: nelroot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Explicitly install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Set up Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
            export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
            TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

            # Rust linker para Android API 24.
            ANDROID_CLANG="$TOOLCHAIN/aarch64-linux-android24-clang"
            ANDROID_AR="$TOOLCHAIN/llvm-ar"
            if [[ ! -x "$ANDROID_CLANG" || ! -x "$ANDROID_AR" ]]; then
              echo "::error::Android NDK toolchain is incomplete at $TOOLCHAIN"
              ls -la "$TOOLCHAIN" || true
              exit 1
            fi

            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_CLANG"

            # ring compiles native C/assembly and needs the NDK compiler explicitly.
            # cc-rs accepts the underscore-normalized target-specific variable.
            export CC_aarch64_linux_android="$ANDROID_CLANG"
            export AR_aarch64_linux_android="$ANDROID_AR"
            export PATH="$TOOLCHAIN:$PATH"
          fi
          cargo build --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/package
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/package/
          cp README.md LICENSE dist/package/
          tar -czf dist/nelroot-${{ matrix.name }}.tar.gz -C dist/package .
      - name: Build Debian package
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            VERSION="$(grep -m1 '^version[[:space:]]*=' Cargo.toml | cut -d '"' -f2)"
            [[ -n "$VERSION" ]] || { echo "::error::Could not read package version from Cargo.toml"; exit 1; }
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            VERSION="${{ inputs.release_tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash packaging/build-deb.sh "$VERSION" "${{ matrix.target }}" "target/${{ matrix.target }}/release/nelroot" dist
          DEB_FILE="$(find dist -maxdepth 1 -name "nelroot_${VERSION}_*.deb" -print -quit)"
          test -n "$DEB_FILE"
          mv "$DEB_FILE" "dist/nelroot-${{ matrix.name }}.deb"
      - name: Install RPM build tools
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build RPM package
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            VERSION="$(grep -m1 '^version[[:space:]]*=' Cargo.toml | cut -d '"' -f2)"
            [[ -n "$VERSION" ]] || { echo "::error::Could not read package version from Cargo.toml"; exit 1; }
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            VERSION="${{ inputs.release_tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash packaging/build-rpm.sh "$VERSION" "${{ matrix.target }}" "target/${{ matrix.target }}/release/nelroot" dist
          RPM_FILE="$(find dist -maxdepth 1 -name "nelroot-${VERSION}-*.rpm" -print -quit)"
          test -n "$RPM_FILE"
          mv "$RPM_FILE" "dist/nelroot-${{ matrix.name }}.rpm"
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/
          Copy-Item README.md,LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/nelroot-${{ matrix.name }}.zip"
      - name: Generate checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          dist = Path("dist")
          archives = sorted(
              path for path in dist.glob("nelroot-${{ matrix.name }}.*")
              if path.is_file() and not path.name.endswith(".sha256")
          )
          if not archives:
              raise SystemExit("No release archives were produced")
          for archive in archives:
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              checksum_name = (
                  f"nelroot-${{ matrix.name }}.sha256"
                  if archive.name == "nelroot-${{ matrix.name }}.tar.gz" or archive.suffix == ".zip"
                  else f"{archive.name}.sha256"
              )
              (dist / checksum_name).write_text(f"{digest}  {archive.name}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: >-
      ${{ needs.build.result == 'success'
          && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
              || startsWith(github.ref, 'refs/tags/v')
              || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Determine release tag
        id: release_meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            VERSION="$(grep -m1 '^version[[:space:]]*=' Cargo.toml | cut -d '"' -f2)"
            [[ -n "$VERSION" ]] || { echo "::error::Could not read package version from Cargo.toml"; exit 1; }
            echo "tag=v${VERSION}-auto.${{ github.event.workflow_run.run_number }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          prerelease: ${{ github.event.workflow_run != null }}
          generate_release_notes: true
          files: |
            release-assets/*
            scripts/install.sh
            scripts/install.ps1
