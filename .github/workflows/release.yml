name: Build and publish releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: nelroot
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: nelroot
          - name: android-aarch64
            os: ubuntu-latest
            target: aarch64-linux-android
            archive: tar.gz
            binary: nelroot
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: nelroot.exe
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: nelroot
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: nelroot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: android-actions/setup-android@v3
      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          fi
          cargo build --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/package
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/package/
          cp README.md LICENSE dist/package/
          tar -czf dist/nelroot-${{ matrix.name }}.tar.gz -C dist/package .
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/
          Copy-Item README.md,LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/nelroot-${{ matrix.name }}.zip"
      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum nelroot-${{ matrix.name }}.* > nelroot-${{ matrix.name }}.sha256
          else
            shasum -a 256 nelroot-${{ matrix.name }}.* > nelroot-${{ matrix.name }}.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |\n            release-assets/*\n            scripts/install.sh\n            scripts/install.ps1
