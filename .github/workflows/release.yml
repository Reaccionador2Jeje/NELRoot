name: Build and publish releases

'on':
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versión que se publicará (por ejemplo, v0.1.1)"
        required: true
        type: string
        default: "v0.1.1"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: nelroot
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: nelroot
          - name: android-aarch64
            os: ubuntu-latest
            target: aarch64-linux-android
            archive: tar.gz
            binary: nelroot
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: nelroot.exe
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: nelroot
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: nelroot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: android-actions/setup-android@v3
        with:
          # 'tools' is deprecated and makes sdkmanager fail on current SDK repositories.
          packages: platform-tools
      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
            export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
            TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

            # Rust linker para Android API 24.
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"

            # El crate ring compila código C y necesita CC explícito.
            # cc-rs busca también la variante con guiones bajos del target.
            export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang"
            export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
            export PATH="$TOOLCHAIN:$PATH"
          fi
          cargo build --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/package
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/package/
          cp README.md LICENSE dist/package/
          tar -czf dist/nelroot-${{ matrix.name }}.tar.gz -C dist/package .
      - name: Build Debian package
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="${{ inputs.release_tag }}"
            VERSION="${VERSION#v}"
          fi
          bash packaging/build-deb.sh "$VERSION" "${{ matrix.target }}" "target/${{ matrix.target }}/release/nelroot" dist
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/
          Copy-Item README.md,LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/nelroot-${{ matrix.name }}.zip"
      - name: Generate checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          dist = Path("dist")
          archives = sorted(
              path for path in dist.glob("nelroot-${{ matrix.name }}.*")
              if path.is_file() and not path.name.endswith(".sha256")
          )
          if not archives:
              raise SystemExit("No release archives were produced")
          for archive in archives:
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              checksum_name = (
                  f"nelroot-${{ matrix.name }}.sha256"
                  if archive.name.endswith(".tar.gz") or archive.suffix == ".zip"
                  else f"{archive.name}.sha256"
              )
              (dist / checksum_name).write_text(f"{digest}  {archive.name}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/*
            scripts/install.sh
            scripts/install.ps1
