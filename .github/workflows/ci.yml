name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No previous commit available; skipping changed-file format check."
            exit 0
          fi

          mapfile -t RUST_FILES < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.rs')
          if (("${#RUST_FILES[@]}" > 0)); then
            rustfmt --edition 2024 --check "${RUST_FILES[@]}"
          else
            echo "No Rust source files changed."
          fi
      - name: Check shell scripts
        run: bash -n scripts/install.sh scripts/smoke-test.sh packaging/build-deb.sh packaging/build-rpm.sh
      - name: Test official rootfs publisher
        run: python3 -m unittest scripts/test_official_images.py
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Build Debian package smoke test
        run: |
          cargo build --release
          VERSION="$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -n 1)"
          bash packaging/build-deb.sh "$VERSION" x86_64-unknown-linux-gnu target/release/nelroot dist
          dpkg-deb --info "dist/nelroot_${VERSION}_amd64.deb"
          dpkg-deb --contents "dist/nelroot_${VERSION}_amd64.deb"
      - name: Build and inspect RPM package
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          VERSION="$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -n 1)"
          bash packaging/build-rpm.sh "$VERSION" x86_64-unknown-linux-gnu target/release/nelroot dist
          rpm -qpl "dist/nelroot-$VERSION-x86_64.rpm"
      - name: Smoke-test CLI and NEXORA JSON contract
        run: bash scripts/smoke-test.sh target/release/nelroot
