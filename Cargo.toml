[package]
name = "nelroot"
version = "0.1.1"
edition = "2024"
description = "Independent Linux execution and virtualization engine"
license = "MIT"
repository = "https://github.com/Reaccionador2Jeje/NELRoot"

[[bin]]
name = "nelroot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
