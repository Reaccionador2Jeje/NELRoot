[package]
name = "nelroot"
version = "0.1.0"
edition = "2024"
description = "Independent Linux execution and virtualization engine"
license = "MIT"
repository = "https://github.com/Reaccionador2Jeje/NELRoot"

[[bin]]
name = "nelroot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
